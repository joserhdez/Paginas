<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulación Reloj Casio</title>
    <style>
        /* Importar una fuente digital retro */
        @import url('https://fonts.cdnfonts.com/css/digital-numbers');

        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }

        /* Estructura externa del reloj (Carcasa negra) */
        .casio-body {
            width: 340px;
            height: 300px;
            background-color: #1a1a1a;
            border-radius: 40px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Bisel frontal con el diseño azul y textos clásicos */
        .bezel {
            width: 300px;
            height: 250px;
            background-color: #0d1b2a;
            border: 4px solid #333;
            border-radius: 20px;
            position: relative;
            box-sizing: border-box;
            padding: 15px;
            border-top: 6px solid #0056b3;
            border-bottom: 6px solid #0056b3;
        }

        /* Textos decorativos estilo Casio */
        .brand {
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 2px;
            margin-top: -5px;
        }

        .model {
            color: #f39c12;
            font-size: 10px;
            text-align: center;
            margin-top: 2px;
        }

        .water-resist {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            color: #e74c3c;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Pantalla LCD (Fondo gris verdoso clásico) */
        .lcd-screen {
            width: 240px;
            height: 120px;
            background-color: #c2c9a9;
            border: 5px solid #222;
            margin: 15px auto 0 auto;
            border-radius: 5px;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.3);
            position: relative;
            padding: 10px;
            box-sizing: border-box;
            font-family: 'Digital Numbers', sans-serif;
            color: #111;
        }

        /* Fila superior: Día de la semana y fecha */
        .top-row {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            height: 20px;
        }

        .day-week {
            font-family: 'Arial', sans-serif; /* El día suele ser texto normal */
            font-size: 14px;
        }

        /* Fila principal: Hora, minutos y segundos */
        .main-time {
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            margin-top: 15px;
            position: relative;
        }

        .time-digits {
            font-size: 52px;
            line-height: 1;
        }

        .seconds-digits {
            font-size: 28px;
            margin-left: 5px;
            padding-bottom: 4px;
            align-self: flex-end;
        }

        /* Animación para los dos puntos parpadeantes */
        .blink {
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Botones simulados en los laterales */
        .button {
            width: 12px;
            height: 24px;
            background-color: #7f8c8d;
            position: absolute;
            border-radius: 3px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        .btn-top-left { left: -10px; top: 70px; }
        .btn-bottom-left { left: -10px; top: 190px; }
        .btn-bottom-right { right: -10px; top: 190px; }

    </style>
</head>
<body>

    <div class="casio-body">
        <div class="button btn-top-left"></div>
        <div class="button btn-bottom-left"></div>
        <div class="button btn-bottom-right"></div>

        <div class="bezel">
            <div class="brand">CASIO</div>
            <div class="model">F-91W</div>
            
            <div class="lcd-screen">
                <div class="top-row">
                    <div id="day-week" class="day-week">WE</div>
                    <div id="day-month">27</div>
                </div>
                <div class="main-time">
                    <div id="clock-hours" class="time-digits">12</div>
                    <div class="time-digits blink">:</div>
                    <div id="clock-minutes" class="time-digits">30</div>
                    <div id="clock-seconds" class="seconds-digits">45</div>
                </div>
            </div>

            <div class="water-resist">WATER RESIST</div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            // Obtener horas y minutos
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let dayMonth = now.getDate();
            
            // Formatear a dos dígitos
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            dayMonth = dayMonth < 10 ? '0' + dayMonth : dayMonth;

            // Días de la semana en el formato corto de Casio (Inglés)
            const days = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
            let dayWeek = days[now.getDay()];

            // Inyectar los valores en el HTML
            document.getElementById('clock-hours').textContent = hours;
            document.getElementById('clock-minutes').textContent = minutes;
            document.getElementById('clock-seconds').textContent = seconds;
            document.getElementById('day-week').textContent = dayWeek;
            document.getElementById('day-month').textContent = dayMonth;
        }

        // Ejecutar la función inmediatamente y luego cada segundo
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
